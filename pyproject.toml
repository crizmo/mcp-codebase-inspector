[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-codebase-inspector"
version = "0.1.0"
description = "A read-only MCP server that lets an LLM inspect a local codebase"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
mcp-codebase-inspector = "mcp_server:main"
mcp-inspect = "mcp_inspect:cli"

[tool.setuptools]
py-modules = ["mcp_server", "mcp_inspect"]
